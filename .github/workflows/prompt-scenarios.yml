name: Prompt scenario gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/prompts/**.json'
  push:
    paths:
      - 'backend/prompts/**.json'

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Verify gate contracts
        working-directory: backend
        run: >-
          uv run --frozen pytest -q
          tests/services/ai/test_prompt_scenario_suite.py
          tests/services/ai/test_prompt_scenario_gate_cli.py
          tests/services/ai/test_prompt_activation_gate.py
          tests/workers/test_experiment_evaluation_worker_retryable.py
          tests/workers/test_prompt_replay_worker.py
      - name: Gate checked-in prompt snapshots
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo 'OPENAI_API_KEY required for live prompt gate' >&2; exit 1; fi
          uv run --frozen python - <<'PY'
          import asyncio
          from pathlib import Path
          from scripts.dev.prompt_scenario_gate import main

          paths = sorted(str(p) for p in Path('prompts').glob('*.json'))
          raise SystemExit(asyncio.run(main(paths)))
          PY
