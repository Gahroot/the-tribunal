[project]
name = "tribunal-offers"
version = "0.1.0"
description = "Extracted 'offers' block from The Tribunal — mountable FastAPI block package."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    # The block depends on the host's core surface via the `app.core_api` facade,
    # plus the sibling lead-capture block (deliver_lead_magnet_to_lead +
    # LeadMagnet/LeadMagnetLead models + LeadMagnetResponse schema), agent-brain
    # (generate_offer_content), and the shared contacts Contact model — all
    # resolved against the host `aicrm-backend` distribution while developed
    # in-repo as a uv workspace member. Pin the real core dependency here when
    # published standalone.
    "tribunal-lead-capture",
    "fastapi>=0.136.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "pydantic>=2.13.4",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tribunal_offers"]

# The block owns the ``offers`` + ``offer_lead_magnets`` tables, but their creating
# revisions live in the host's shared Alembic chain (``backend/alembic/versions/``),
# so this package ships no ``migrations/`` dir.
# See docs/blocks/offers/BLOCK.md (alembic_migrations: shared chain).
